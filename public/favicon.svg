<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22c3e6"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- gopher head -->
  <circle cx="16" cy="18" r="7.2" fill="white"/>

  <!-- ears -->
  <circle cx="10.2" cy="12.2" r="2.6" fill="white"/>
  <circle cx="21.8" cy="12.2" r="2.6" fill="white"/>
  <circle cx="10.2" cy="12.2" r="1.1" fill="#0891b2"/>
  <circle cx="21.8" cy="12.2" r="1.1" fill="#0891b2"/>

  <!-- eyes -->
  <circle cx="13.1" cy="17" r="1.9" fill="#0891b2"/>
  <circle cx="18.9" cy="17" r="1.9" fill="#0891b2"/>
  <circle cx="13.5" cy="16.6" r="0.7" fill="white"/>
  <circle cx="19.3" cy="16.6" r="0.7" fill="white"/>

  <!-- nose -->
  <ellipse cx="16" cy="21.3" rx="1.6" ry="1.2" fill="#0891b2"/>

  <!-- teeth -->
  <rect x="14.9" y="22.2" width="1" height="1.6" rx="0.3" fill="white"/>
  <rect x="16.1" y="22.2" width="1" height="1.6" rx="0.3" fill="white"/>
</svg>
